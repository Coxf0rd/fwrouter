name: FWRouter affected CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fwrouter-affected-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Immutable plan and preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      needs_hosted: ${{ steps.plan.outputs.needs_hosted }}
      needs_packet: ${{ steps.plan.outputs.needs_packet }}
      needs_provider: ${{ steps.plan.outputs.needs_provider }}
      needs_native: ${{ steps.plan.outputs.needs_native }}
      needs_runtime: ${{ steps.plan.outputs.needs_runtime }}
      main_smoke: ${{ steps.plan.outputs.main_smoke }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Stop targeted qualification before full required CI
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'fix/api-runtime-health-scale-stability'
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -Eq -- 'ci:validate-(identities|final-fixes|packet)'; then
            echo 'Targeted qualification requested; full required CI NOT RUN. Normal final push required.' >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Lint workflow syntax with pinned actionlint binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Validate catalog and isolation bootstrap
        run: |
          python tests/gates/gate.py validate
          python tests/gates/gate.py dry-run --level L7
          python tests/gates/isolation_smoke.py
      - name: Resolve immutable base and plan affected L0-L5
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BASE_SHA"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'Cannot resolve immutable event base SHA' >&2
            exit 2
          fi
          python tests/gates/gate.py lint-changed --base "$BASE"
          mkdir -p "$RUNNER_TEMP/plan"
          PLAN="$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          PLAN_ARGS=(--base "$BASE" --include-native --output "$PLAN")
          mandatory_all=false
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            mandatory_all=true
          elif [ "$EVENT_NAME" = pull_request ] \
            && [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
            && git log -1 --format=%B | grep -Fq -- 'ci:full-acceptance'; then
            mandatory_all=true
          fi
          if [ "$mandatory_all" = true ]; then
            PLAN_ARGS+=(--mandatory-all)
          fi
          python tests/gates/gate.py plan "${PLAN_ARGS[@]}"
          smoke=()
          if [ "$EVENT_NAME" = push ]; then smoke+=(--main-smoke); fi
          python tests/gates/parallel_ci.py configure --plan "$PLAN" --github-output "$GITHUB_OUTPUT" "${smoke[@]}"
      - name: Upload immutable plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build and verify source once
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Verify immutable preflight artifact
        run: python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - name: Build backend and verify static UI
        id: execution
        run: python tests/gates/ci_inputs.py prepare --root "$RUNNER_TEMP/build" --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - name: Seal bounded build evidence
        if: always()
        run: >-
          python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/build" --role build --outcome '${{ steps.execution.outcome }}'
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

  unit:
    name: Backend installer and frontend tests
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Verify immutable preflight artifact
        run: python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - name: Run isolated unit profile
        id: execution
        run: >-
          python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/unit" --role unit
      - name: Seal bounded unit evidence
        if: always()
        run: >-
          python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/unit" --role unit --outcome '${{ steps.execution.outcome }}'
      - name: Upload unit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

  hosted:
    name: Ordinary functional and browser
    needs: [plan, build]
    if: needs.plan.outputs.needs_hosted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Verify immutable preflight artifact
        run: python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build
      - name: Run isolated hosted profile
        id: execution
        run: >-
          python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/hosted" --role hosted
      - name: Seal bounded hosted evidence
        if: always()
        run: >-
          python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/hosted" --role hosted --outcome '${{ steps.execution.outcome }}'
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

  provider:
    name: Provider and browser cohort
    needs: [plan, build]
    if: needs.plan.outputs.needs_provider == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Verify immutable preflight artifact
        run: python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build
      - name: Run isolated provider profile
        id: execution
        run: >-
          python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/provider" --role provider
      - name: Seal bounded provider evidence
        if: always()
        run: >-
          python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/provider" --role provider --outcome '${{ steps.execution.outcome }}'
      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

  packet:
    name: Kernel packet and fail-closed
    needs: [plan, build]
    if: needs.plan.outputs.needs_packet == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Verify immutable preflight artifact
        run: python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build
      - name: Run isolated packet profile
        id: execution
        run: >-
          python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/packet" --role packet
      - name: Seal bounded packet evidence
        if: always()
        run: >-
          python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/packet" --role packet --outcome '${{ steps.execution.outcome }}'
      - name: Upload packet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packet/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

  native:
    name: Qualified native Mihomo and Xray
    needs: [plan, build]
    if: needs.plan.outputs.needs_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Verify immutable preflight artifact
        run: python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fwrouter-v2-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build
      - name: Run isolated native profile
        id: execution
        run: >-
          python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/native" --role native
      - name: Seal bounded native evidence
        if: always()
        run: >-
          python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
          --root "$RUNNER_TEMP/native" --role native --outcome '${{ steps.execution.outcome }}'
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-v2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

  affected:
    name: Affected L0-L5 with hosted profiles
    if: always()
    needs: [plan, build, unit, hosted, provider, packet, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
      FWROUTER_CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Download current attempt producer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fwrouter-v2-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
      - name: Aggregate immutable evidence and qualify safe recovery
        if: always()
        run: |
          set -euo pipefail
          smoke=()
          if [ '${{ github.event_name }}' = push ]; then smoke+=(--main-smoke); fi
          python tests/gates/parallel_ci.py aggregate \
            --plan "$RUNNER_TEMP/evidence/fwrouter-v2-plan-${{ github.run_id }}-${{ github.run_attempt }}/fwrouter-affected-plan.json" \
            --artifacts "$RUNNER_TEMP/evidence" --root "$RUNNER_TEMP/required" "${smoke[@]}"
      - name: Retain bounded required reports and recovery qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-required-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required/
          if-no-files-found: error
          retention-days: 30
          compression-level: 3
