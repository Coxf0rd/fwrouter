name: FWRouter test gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable base commit to compare in the manual run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fwrouter-test-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: L0 and deterministic affected suites
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install declared test runtime
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Validate catalog and stage dry-run
        run: |
          python tests/gates/gate.py validate
          python tests/gates/gate.py dry-run --level L7
      - name: Isolated component L4 smoke
        run: python tests/gates/gate.py smoke --profile isolated
      - name: Plan and run default affected gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ github.event.inputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then BASE="$PR_BASE_SHA";
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then BASE="$MANUAL_BASE_SHA";
          else BASE="$PUSH_BASE_SHA"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Cannot resolve immutable event base SHA" >&2
            exit 2
          fi
          PLAN="$RUNNER_TEMP/fwrouter-plan.json"
          REPORT="$RUNNER_TEMP/fwrouter-report.json"
          python tests/gates/gate.py plan --base "$BASE" --output "$PLAN"
          set +e
          python tests/gates/gate.py run --plan "$PLAN" --output "$REPORT"
          RESULT=$?
          set -e
          if [ "$RESULT" -eq 0 ]; then
            python tests/gates/gate.py promotion-check --plan "$PLAN" --report "$REPORT"
          fi
          exit "$RESULT"
      - name: Retain bounded redacted gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-gates-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-plan.json
            ${{ runner.temp }}/fwrouter-report.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
