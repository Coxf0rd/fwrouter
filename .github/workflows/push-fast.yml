name: FWRouter push fast lane

on:
  push:
    branches-ignore: [main, stage/test-architecture-ci-stabilization]

permissions:
  contents: read

concurrency:
  group: fwrouter-push-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: L0-L1 routine quick selection
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Validate isolation bootstrap
        run: python tests/gates/isolation_smoke.py
      - name: Plan and run routine affected L0-L1 only
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$EVENT_BEFORE" ] || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            echo "Push has no resolvable immutable before SHA" >&2
            exit 2
          fi
          PLAN="$RUNNER_TEMP/fwrouter-fast-plan.json"
          REPORT="$RUNNER_TEMP/fwrouter-fast-report.json"
          python tests/gates/gate.py plan --base "$EVENT_BEFORE" --quick-push --output "$PLAN"
          python tests/gates/gate.py run --plan "$PLAN" --output "$REPORT" \
            > "$RUNNER_TEMP/fwrouter-fast.log" 2>&1 || { tail -c 65536 "$RUNNER_TEMP/fwrouter-fast.log"; exit 1; }
          cat "$RUNNER_TEMP/fwrouter-fast.log"
      - name: Retain exact quick selection and bounded failure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-fast-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-fast-plan.json
            ${{ runner.temp }}/fwrouter-fast-report.json
            ${{ runner.temp }}/fwrouter-fast.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
