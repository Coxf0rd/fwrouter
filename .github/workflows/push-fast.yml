name: FWRouter push fast lane

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: fwrouter-push-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: L0-L1 routine quick selection
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Validate isolation bootstrap
        run: python tests/gates/isolation_smoke.py
      - name: Plan and run routine affected L0-L1 only
        id: quick
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          printf 'changed\n' > "$RUNNER_TEMP/fwrouter-fast-state"
          # A new branch push has the zero SHA, not a previous commit.
          # Resolve its immutable fork point from the fully fetched main ref.
          if [ "$EVENT_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            EVENT_BEFORE="$(git merge-base HEAD refs/remotes/origin/main)"
          fi
          if [ -z "$EVENT_BEFORE" ] || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            echo "Push has no resolvable immutable before SHA" >&2
            exit 2
          fi
          python tests/gates/gate.py lint-changed --base "$EVENT_BEFORE"
          CHANGED_PATHS="$RUNNER_TEMP/fwrouter-fast-changed-paths.bin"
          git diff --name-only -z "$EVENT_BEFORE" HEAD -- > "$CHANGED_PATHS"
          if [ ! -s "$CHANGED_PATHS" ]; then
            printf 'unchanged\n' > "$RUNNER_TEMP/fwrouter-fast-state"
            exit 0
          fi
          PLAN="$RUNNER_TEMP/fwrouter-fast-plan.json"
          REPORT="$RUNNER_TEMP/fwrouter-fast-report.json"
          python tests/gates/gate.py plan --base "$EVENT_BEFORE" --quick-push --output "$PLAN"
          python tests/gates/gate.py run --plan "$PLAN" --output "$REPORT" \
            > "$RUNNER_TEMP/fwrouter-fast.log" 2>&1
      - name: Write non-promotional quick summary
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EXECUTION_OUTCOME: ${{ steps.quick.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python tests/gates/evidence_bundle.py quick-summary \
            --plan "$RUNNER_TEMP/fwrouter-fast-plan.json" \
            --report "$RUNNER_TEMP/fwrouter-fast-report.json" \
            --state "$RUNNER_TEMP/fwrouter-fast-state" \
            --output "$RUNNER_TEMP/fwrouter-fast-summary.md" \
            --expected-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$EVENT_NAME" --ref "$EVENT_REF" --execution-outcome "${EXECUTION_OUTCOME:-unknown}" \
            --run-url "$RUN_URL"
          if [ -f "$RUNNER_TEMP/fwrouter-fast-summary.md" ]; then
            cat "$RUNNER_TEMP/fwrouter-fast-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## FWRouter branch quick check\n\n**Quick-scope result: INCOMPLETE.** Summary generation failed; inspect this run log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
