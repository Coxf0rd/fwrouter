name: FWRouter L7 controlled recovery gate

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: Type RUN L7 RECOVERY to permit the isolated recovery cohort
        required: true
        type: string
      expected_sha:
        description: Full 40-character source SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fwrouter-l7-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    name: Explicit L7 recovery inside qualified isolated Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce manual release-policy gate
        env:
          ACKNOWLEDGE: ${{ inputs.acknowledge }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$ACKNOWLEDGE" = 'RUN L7 RECOVERY'
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Install hashed test dependencies and validate boundaries
        run: |
          python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
          python tests/gates/gate.py validate
          python tests/gates/gate.py dry-run --level L7 --manual
      - name: Bind recovery to reviewed source plan and pinned hosted inputs
        run: |
          set -euo pipefail
          python tests/gates/gate.py full-suite-plan --manual --include-native \
            --output "$RUNNER_TEMP/fwrouter-l7-plan.json"
          digest=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["plan_digest"])' \
            "$RUNNER_TEMP/fwrouter-l7-plan.json")
          printf 'FWROUTER_ACCEPTANCE_PLAN_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          python tests/acceptance/provision.py --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Run L7 only in the pinned internal test container
        run: |
          set -euo pipefail
          /usr/bin/time -v python tests/acceptance/launcher.py --run --suite recovery --allow-recovery \
            > "$RUNNER_TEMP/fwrouter-l7-recovery.log" 2>&1 || {
              tail -c 65536 "$RUNNER_TEMP/fwrouter-l7-recovery.log"
              exit 1
            }
          cat "$RUNNER_TEMP/fwrouter-l7-recovery.log"
      - name: Retain L7 recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-l7-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-l7-plan.json
            ${{ runner.temp }}/fwrouter-l7-recovery.log
            ${{ runner.temp }}/fwrouter-acceptance-inputs/inputs.json
            ${{ runner.temp }}/fwrouter-acceptance-*-artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3
