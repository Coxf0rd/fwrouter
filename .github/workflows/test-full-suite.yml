name: FWRouter L6 full regression

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      acknowledge:
        description: Type RUN L6 to execute the complete declared suite
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fwrouter-l6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  l6:
    name: L6 complete manifest, hosted profiles required
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce manual L6 gate
        if: github.event_name == 'workflow_dispatch'
        env:
          ACKNOWLEDGE: ${{ inputs.acknowledge }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$ACKNOWLEDGE" = 'RUN L6'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        with:
          python-version: 3.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Verify CI isolation helper
        run: |
          python tests/gates/isolation_smoke.py
      - name: Create manual L6 plan and run routine cohorts
        run: |
          set -euo pipefail
          python tests/gates/gate.py validate
          PLAN="$RUNNER_TEMP/fwrouter-l6-plan.json"
          REPORT="$RUNNER_TEMP/fwrouter-l6-unit.json"
          python tests/gates/gate.py full-suite-plan --manual --include-native --output "$PLAN"
          python - "$PLAN" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          print("FWROUTER_ACCEPTANCE_PLAN_DIGEST=" + json.load(open(sys.argv[1]))["plan_digest"])
          PY
          set +e
          python tests/gates/gate.py run --plan "$PLAN" --manual-full-suite --include-native \
            --defer-hosted --output "$REPORT" > "$RUNNER_TEMP/fwrouter-l6-unit.log" 2>&1
          result=$?
          set -e
          printf 'unit_exit=%s\n' "$result"
      - name: Provision exact native and browser inputs
        run: |
          set -euo pipefail
          python tests/acceptance/provision.py --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
          cp "$RUNNER_TEMP/fwrouter-acceptance-inputs/inputs.json" "$RUNNER_TEMP/fwrouter-runtime-inputs.json"
      - name: Run full L6 hosted functional, qualified child, native, and browser checks
        run: |
          set -euo pipefail
          failures=0
          for attempt in 1 2; do
            set +e
            /usr/bin/time -v python tests/acceptance/launcher.py --run --suite functional \
              > "$RUNNER_TEMP/fwrouter-l6-functional-$attempt.log" 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then failures=1; fi
          done
          set +e
          /usr/bin/time -v python tests/acceptance/qualified_child.py --run \
            > "$RUNNER_TEMP/fwrouter-l6-qcp.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then failures=1; fi
          set +e
          /usr/bin/time -v python tests/acceptance/qualified_xray_docker.py --run \
            > "$RUNNER_TEMP/fwrouter-l6-xray-docker.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then failures=1; fi
          printf 'hosted_exit=%s\n' "$failures"
          test "$failures" -eq 0
      - name: Aggregate full L6 evidence
        run: |
          set -euo pipefail
          args=(--plan "$RUNNER_TEMP/fwrouter-l6-plan.json" --unit-report "$RUNNER_TEMP/fwrouter-l6-unit.json" \
            --runtime-inputs "$RUNNER_TEMP/fwrouter-runtime-inputs.json" --minimum-repeats 2 \
            --output "$RUNNER_TEMP/fwrouter-l6-aggregate.json")
          while IFS= read -r path; do args+=(--hosted-report "$path"); done \
            < <(find "$RUNNER_TEMP" -type f -name hosted-acceptance-report.json -print | sort)
          while IFS= read -r path; do args+=(--qcp-report "$path"); done \
            < <(find "$RUNNER_TEMP" -type f -name qualified-child-receipt.json -print | sort)
          while IFS= read -r path; do args+=(--xray-docker-report "$path"); done \
            < <(find "$RUNNER_TEMP" -type f -name qualified-xray-docker-receipt.json -print | sort)
          python tests/gates/aggregate_hosted.py "${args[@]}"
      - name: Upload L6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-l6-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-l6-*
            ${{ runner.temp }}/fwrouter-runtime-inputs.json
            ${{ runner.temp }}/fwrouter-acceptance-*-artifacts/**
            ${{ runner.temp }}/fwrouter-qcp-*-artifacts/**
            ${{ runner.temp }}/fwrouter-xray-native-*-artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3
