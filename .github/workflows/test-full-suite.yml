name: FWRouter L6 full regression
'on':
  schedule:
  - cron: 17 4 * * *
  workflow_dispatch:
    inputs:
      acknowledge:
        description: Type RUN L6
        required: true
        type: string
      qualification_mode:
        description: main release evidence or non-promotional branch qualification
        required: true
        default: main
        type: choice
        options:
        - main
        - branch
      expected_sha:
        description: Exact 40-character source SHA (required for manual runs)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fwrouter-l6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: L6 immutable full manifest and static preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      unit_shards_json: ${{ steps.plan.outputs.unit_shards_json }}
      native_profiles_json: ${{ steps.plan.outputs.native_profiles_json }}
      qualification_scope: ${{ steps.plan.outputs.qualification_scope }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - name: Install hashed preflight dependencies
      run: python -m pip install --require-hashes -r tests/gates/requirements-preflight.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.22.2
    - name: Lint workflow syntax with pinned actionlint binary
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/actionlint.tar.gz"
        curl --fail --location --silent --show-error --retry 2 --max-time 30 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$archive"
        echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
    - name: Validate catalog and isolation bootstrap
      run: |
        python tests/gates/gate.py validate
        python tests/gates/gate.py dry-run --level L7
        python tests/gates/isolation_smoke.py
    - name: Bind exact trigger and complete safe L6 plan
      id: plan
      env:
        ACKNOWLEDGE: ${{ inputs.acknowledge }}
        MODE: ${{ inputs.qualification_mode }}
        EXPECTED_SHA: ${{ inputs.expected_sha }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/plan"
        PLAN="$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
        python tests/gates/gate.py full-suite-plan --manual --include-native --output "$PLAN"
        python tests/gates/l6_ci.py configure --plan "$PLAN" --github-output "$GITHUB_OUTPUT" \
          --acknowledge "$ACKNOWLEDGE" --mode "${MODE:-main}" --expected-sha "$EXPECTED_SHA"
    - name: Upload immutable plan
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan/
        if-no-files-found: error
        retention-days: 1
    - name: Write plan Job Summary
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" ]; then
          python tests/gates/parallel_ci.py summary --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" \
            --root "$RUNNER_TEMP/plan" --role plan --outcome '${{ steps.plan.outcome }}' >> "$GITHUB_STEP_SUMMARY"
        else
          printf '## FWRouter CI plan\n\n**Status:** NOT RUN or plan unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
        fi
  build:
    name: L6 Build and verify source once
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.22.2
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan
    - name: Verify immutable preflight artifact
      run: |
        python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --l6
    - name: Build backend and verify static UI
      id: execution
      run: python tests/gates/ci_inputs.py prepare --root "$RUNNER_TEMP/build" --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json"
    - name: Seal bounded build evidence
      if: always()
      run: |
        python tests/gates/parallel_ci.py seal --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/build" --role build --outcome '${{ steps.execution.outcome }}' --l6
    - name: Upload build evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build/
        if-no-files-found: error
        retention-days: 1
        compression-level: 3
    - name: Write build Job Summary
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" ]; then
          python tests/gates/parallel_ci.py summary --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" \
            --root "$RUNNER_TEMP/build" --role build --outcome '${{ steps.execution.outcome }}' >> "$GITHUB_STEP_SUMMARY"
        else
          printf '## FWRouter CI build\n\n**Status:** NOT RUN or plan unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
        fi
  unit:
    name: L6 Routine and contract shard (${{ matrix.shard }})
    needs:
    - plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.unit_shards_json) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - name: Install hashed CI dependencies
      run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.22.2
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan
    - name: Verify immutable preflight artifact
      run: |
        python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --l6
    - name: Run isolated unit profile
      id: execution
      run: |
        python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/unit" --role unit --shard-group "${{ matrix.shard }}" --l6
    - name: Project unit evidence for cross-job handoff
      if: always()
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
      run: |
        python tests/gates/evidence_bundle.py handoff --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --source "$RUNNER_TEMP/unit" --destination "$RUNNER_TEMP/unit-handoff" --role unit --shard-group "${{ matrix.shard }}" --outcome '${{ steps.execution.outcome }}' --event "$EVENT_NAME" --ref "$EVENT_REF" --l6
    - name: Write routine shard Job Summary
      if: always()
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/unit/shard.json"
        if [ -f "$report" ]; then
          python tests/gates/routine_shards.py summary --report "$report" >> "$GITHUB_STEP_SUMMARY"
        else
          printf '## FWRouter CI routine shard: %s\n\n**Status:** NOT RUN or report unavailable; see failed setup/worker steps.\n' \
            '${{ matrix.shard }}' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload unit evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-unit-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/unit-handoff/
        if-no-files-found: error
        retention-days: 1
        compression-level: 3
  hosted:
    name: L6 Ordinary functional and browser repeat ${{ matrix.repeat }}
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan
    - name: Verify immutable preflight artifact
      run: |
        python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --l6
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build
    - name: Run isolated hosted profile
      id: execution
      run: |
        python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/hosted" --role hosted --l6
    - name: Project hosted evidence for cross-job handoff
      if: always()
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
      run: |
        python tests/gates/evidence_bundle.py handoff --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --source "$RUNNER_TEMP/hosted" --destination "$RUNNER_TEMP/hosted-handoff" --role hosted --outcome '${{ steps.execution.outcome }}' --event "$EVENT_NAME" --ref "$EVENT_REF" --l6
    - name: Upload hosted evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-hosted-r${{ matrix.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hosted-handoff/
        if-no-files-found: error
        retention-days: 1
        compression-level: 3
    - name: Write hosted Job Summary
      if: always()
      run: python tests/gates/parallel_ci.py summary --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/hosted"
        --role hosted --outcome '${{ steps.execution.outcome }}' >> "$GITHUB_STEP_SUMMARY"
    strategy:
      fail-fast: false
      matrix:
        repeat:
        - '1'
        - '2'
  provider:
    name: L6 Provider and browser cohort repeat ${{ matrix.repeat }}
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan
    - name: Verify immutable preflight artifact
      run: |
        python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --l6
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build
    - name: Run isolated provider profile
      id: execution
      run: |
        python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/provider" --role provider --l6
    - name: Project provider evidence for cross-job handoff
      if: always()
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
      run: |
        python tests/gates/evidence_bundle.py handoff --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --source "$RUNNER_TEMP/provider" --destination "$RUNNER_TEMP/provider-handoff" --role provider --outcome '${{ steps.execution.outcome }}' --event "$EVENT_NAME" --ref "$EVENT_REF" --l6
    - name: Upload provider evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-provider-r${{ matrix.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/provider-handoff/
        if-no-files-found: error
        retention-days: 1
        compression-level: 3
    - name: Write provider Job Summary
      if: always()
      run: python tests/gates/parallel_ci.py summary --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/provider"
        --role provider --outcome '${{ steps.execution.outcome }}' >> "$GITHUB_STEP_SUMMARY"
    strategy:
      fail-fast: false
      matrix:
        repeat:
        - '1'
        - '2'
  packet:
    name: L6 Kernel packet and fail-closed repeat ${{ matrix.repeat }}
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan
    - name: Verify immutable preflight artifact
      run: |
        python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --l6
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build
    - name: Run isolated packet profile
      id: execution
      run: |
        python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/packet" --role packet --l6
    - name: Project packet evidence for cross-job handoff
      if: always()
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
      run: |
        python tests/gates/evidence_bundle.py handoff --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --source "$RUNNER_TEMP/packet" --destination "$RUNNER_TEMP/packet-handoff" --role packet --outcome '${{ steps.execution.outcome }}' --event "$EVENT_NAME" --ref "$EVENT_REF" --l6
    - name: Upload packet evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-packet-r${{ matrix.repeat }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/packet-handoff/
        if-no-files-found: error
        retention-days: 1
        compression-level: 3
    - name: Write packet Job Summary
      if: always()
      run: python tests/gates/parallel_ci.py summary --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/packet"
        --role packet --outcome '${{ steps.execution.outcome }}' >> "$GITHUB_STEP_SUMMARY"
    strategy:
      fail-fast: false
      matrix:
        repeat:
        - '1'
        - '2'
  native:
    name: L6 Qualified native profile (${{ matrix.profile }})
    needs:
    - plan
    - build
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.native_profiles_json) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - name: Install hashed CI dependencies
      run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plan
    - name: Verify immutable preflight artifact
      run: |
        python tests/gates/parallel_ci.py verify-plan --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --l6
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fwrouter-l6-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build
    - name: Run isolated native profile
      id: execution
      run: |
        python tests/gates/parallel_ci.py worker --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/native" --role native --native-profile "${{ matrix.profile }}" --l6
    - name: Project native evidence for cross-job handoff
      if: always()
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF: ${{ github.ref }}
      run: |
        python tests/gates/evidence_bundle.py handoff --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --source "$RUNNER_TEMP/native" --destination "$RUNNER_TEMP/native-handoff" --role native --native-profile "${{ matrix.profile }}" --outcome '${{ steps.execution.outcome }}' --event "$EVENT_NAME" --ref "$EVENT_REF" --l6
    - name: Upload native evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-native-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-handoff/
        if-no-files-found: error
        retention-days: 1
        compression-level: 3
    - name: Write native Job Summary
      if: always()
      run: python tests/gates/parallel_ci.py summary --plan "$RUNNER_TEMP/plan/fwrouter-affected-plan.json" --root "$RUNNER_TEMP/native"
        --role native --native-profile "${{ matrix.profile }}" --outcome '${{ steps.execution.outcome }}' >> "$GITHUB_STEP_SUMMARY"
  l6:
    name: L6 strict regression qualification
    if: always()
    needs:
    - plan
    - build
    - unit
    - hosted
    - provider
    - packet
    - native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FWROUTER_CI_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
      FWROUTER_CI_NEEDS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.2
    - name: Download only this run and attempt handoffs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: fwrouter-l6-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/evidence
    - name: Snapshot exact upstream job results
      if: always()
      run: |-
        python - <<'PY'
        import json,os
        from pathlib import Path
        Path(os.environ['RUNNER_TEMP'],'jobs.json').write_text(os.environ['FWROUTER_CI_NEEDS'])
        PY
    - name: Strict complete regression and safe recovery
      id: aggregate
      if: always()
      env:
        QUALIFICATION_SCOPE: ${{ needs.plan.outputs.qualification_scope }}
      run: python tests/gates/l6_ci.py aggregate --artifacts "$RUNNER_TEMP/evidence" --root "$RUNNER_TEMP/required" --scope "$QUALIFICATION_SCOPE"
    - name: Build and independently verify complete L6 evidence
      id: evidence
      if: steps.aggregate.outcome == 'success'
      run: |
        set -euo pipefail
        python tests/gates/l6_ci.py bundle --artifacts "$RUNNER_TEMP/evidence" --root "$RUNNER_TEMP/required" --bundle "$RUNNER_TEMP/final-bundle"
        python tests/gates/l6_ci.py verify --bundle "$RUNNER_TEMP/final-bundle" --expected-sha "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
    - name: Publish complete L6 regression evidence
      id: publish_bundle
      if: steps.aggregate.outcome == 'success' && steps.evidence.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/final-bundle/
        retention-days: 7
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 3
    - name: Build redacted failed regression diagnostics
      if: always() && (steps.aggregate.outcome != 'success' || steps.evidence.outcome != 'success' || steps.publish_bundle.outcome !=
        'success')
      run: python tests/gates/evidence_bundle.py diagnostics --l6 --required "$RUNNER_TEMP/required" --evidence "$RUNNER_TEMP/evidence" --jobs
        "$RUNNER_TEMP/jobs.json" --destination "$RUNNER_TEMP/diagnostics" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --run-id
        "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
    - name: Publish bounded failed diagnostics
      if: always() && (steps.aggregate.outcome != 'success' || steps.evidence.outcome != 'success' || steps.publish_bundle.outcome !=
        'success')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fwrouter-l6-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/diagnostics/
        retention-days: 3
        if-no-files-found: error
    - name: Write complete regression summary and enforce publication
      if: always()
      env:
        AGGREGATE: ${{ steps.aggregate.outcome }}
        EVIDENCE: ${{ steps.evidence.outcome }}
        PUBLICATION: ${{ steps.publish_bundle.outcome }}
        ARTIFACT_ID: ${{ steps.publish_bundle.outputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ steps.publish_bundle.outputs.artifact-digest }}
      run: |
        set +e
        python tests/gates/evidence_bundle.py summary --required "$RUNNER_TEMP/required" --output "$RUNNER_TEMP/summary.md" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --aggregate-outcome "$AGGREGATE" --bundle-outcome "$EVIDENCE" --publish-outcome "$PUBLICATION" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
        summary_exit=$?
        cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
        exit "$summary_exit"
