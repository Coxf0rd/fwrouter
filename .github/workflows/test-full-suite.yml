name: FWRouter L6 full regression

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fwrouter-l6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  l6:
    name: L6 complete manifest (serial)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install declared test runtime
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Plan and execute the complete declared manifest
        run: |
          python tests/gates/gate.py validate
          PLAN="$RUNNER_TEMP/fwrouter-l6-plan.json"
          REPORT="$RUNNER_TEMP/fwrouter-l6-report.json"
          python tests/gates/gate.py full-suite-plan --manual --include-native --output "$PLAN"
          set +e
          python tests/gates/gate.py run --plan "$PLAN" --manual-full-suite --include-native --output "$REPORT"
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "L6 blocked or failed. Native runtimes must already be pinned and available; this workflow never downloads binaries or images."
            exit "$RESULT"
          fi
      - name: Retain bounded redacted L6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fwrouter-l6-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-l6-plan.json
            ${{ runner.temp }}/fwrouter-l6-report.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
