            --log "$RUNNER_TEMP/phase-d-target-fixtures/readmodels.log" \
            tests/test_ui_state.py::test_ui_readmodels_share_subject_health_from_projection \
            tests/test_ui_state.py::test_list_ui_clients_includes_traffic_and_filters_internal_xray \
            tests/test_ui_state.py::test_system_visibility_filters_ui_clients_and_inventory \
            tests/test_ui_state.py::test_ui_settings_inventory_is_loaded_separately \
            tests/test_ui_state.py::test_ui_settings_inventory_external_client_exposes_subscription_url \
            tests/test_ui_state.py::test_xray_subscription_profiles_are_grouped_by_client \
            tests/test_ui_state.py::test_disabled_xray_subscription_profile_remains_visible_with_separate_runtime_state \
            tests/test_ui_state.py::test_opaque_xray_subscription_profile_nodes_are_hidden \
            tests/test_ui_state.py::test_subscription_display_name_different_from_token_stays_in_inventory \
            tests/test_ui_state.py::test_list_ui_clients_reuses_cached_traffic_and_effective_state \
            tests/test_runtime_summary.py::test_runtime_summary_does_not_probe_external_ingress_without_connection \
            tests/test_runtime_summary.py::test_runtime_summary_exposes_dataplane_capability \
            tests/test_runtime_summary.py::test_runtime_summary_includes_scoped_egress_diagnostics \
            tests/test_runtime_summary.py::test_system_summary_reports_runtime_status_instead_of_skeleton \
            tests/test_runtime_summary.py::test_system_summary_uses_external_ingress_taxonomy_names \
            tests/test_runtime_summary.py::test_runtime_summary_uses_persisted_subscription_state \
            tests/test_runtime_summary.py::test_runtime_summary_exposes_automation_flags \
            tests/test_isolation_bootstrap.py::test_isolated_host_observations_keep_external_source_probe_unavailable
      - name: Run exact subscription group alias regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-target-fixtures"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-target-fixtures/group-alias.xml" \
            --report "$RUNNER_TEMP/phase-d-target-fixtures/group-alias.json" \
            --log "$RUNNER_TEMP/phase-d-target-fixtures/group-alias.log" \
            tests/test_subscription_group_alias.py::test_subscription_group_alias_updates_canonical_label_and_settings_projection \
            tests/test_subscription_group_alias.py::test_subscription_group_alias_rejects_unknown_ambiguous_and_multiclient_groups \
            tests/test_subscription_group_alias.py::test_subscription_group_alias_audit_failure_rolls_back_and_preserves_cache \
            tests/test_subscription_group_alias.py::test_ordinary_subject_alias_still_updates_subject_alias_only
      - name: Retain read-model fixture receipt and bounded logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-target-readmodel-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/phase-d-target-fixtures/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3

  target-validation-result:
    name: Require both target diagnostic checks
    needs: [select-stage, minimal-xray-diagnostic, target-readmodel-fixtures]
    if: always() && needs.select-stage.outputs.stage == 'targets'
    runs-on: ubuntu-24.04
    steps:
      - name: Require native diagnostic and read-model fixture job success
        env:
          NATIVE_RESULT: ${{ needs.minimal-xray-diagnostic.result }}
          FIXTURE_RESULT: ${{ needs.target-readmodel-fixtures.result }}
        run: |
          set -euo pipefail
          if [[ "$NATIVE_RESULT" != success || "$FIXTURE_RESULT" != success ]]; then
            echo "Target validation incomplete: native=$NATIVE_RESULT readmodels=$FIXTURE_RESULT" >&2
            exit 1
          fi
          echo "Both fixed target diagnostic jobs passed."

  qualified-native:
    name: Qualified Mihomo child and isolated Docker Xray lanes
    needs: [select-stage, minimal-xray-diagnostic]
    if: >-
      needs.minimal-xray-diagnostic.result == 'success' &&
      (needs.select-stage.outputs.stage == 'qualified' ||
       needs.select-stage.outputs.stage == 'functional-bundle')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Bind native receipts to fixed source plan and provision exact inputs
        env:
          PHASE_D_BASE_SHA: 6bdf37e9c73b5728b8d50e971f34d848610eb345
        run: |
          set -euo pipefail
          git cat-file -e "$PHASE_D_BASE_SHA^{commit}"
          plan="$RUNNER_TEMP/phase-d-qualified-plan.json"
          python tests/gates/gate.py plan --base "$PHASE_D_BASE_SHA" --include-native --output "$plan"
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["plan_digest"])' "$plan")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'FWROUTER_ACCEPTANCE_PLAN_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          python tests/acceptance/provision.py --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" \
            > "$RUNNER_TEMP/phase-d-qualified-provision.log" 2>&1
          cp "$RUNNER_TEMP/fwrouter-acceptance-inputs/inputs.json" "$RUNNER_TEMP/phase-d-qualified-inputs.json"
      - name: Run both real qualified native profiles and retain both outcomes
        run: |
          set -euo pipefail
          failures=0
          for helper in qualified_child.py qualified_xray_docker.py; do
            if [ "$helper" = qualified_child.py ]; then label=qcp; else label=xray-docker; fi
            set +e
            /usr/bin/time -v python "tests/acceptance/$helper" --run \
              > "$RUNNER_TEMP/phase-d-qualified-$label.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/phase-d-qualified-$label.log"
            if [ "$result" -ne 0 ]; then failures=1; fi
          done
          test "$failures" -eq 0
      - name: Retain native profile receipts, logs, and runner resources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-qualified-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase-d-qualified-*
            ${{ runner.temp }}/fwrouter-qcp-*-artifacts/**
            ${{ runner.temp }}/fwrouter-xray-native-*-artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3

  full-affected-functional:
    name: Full affected L0-L5 and functional 38 + packet 2-node bundle
    needs: [select-stage, qualified-native]
    if: >-
      needs.qualified-native.result == 'success' &&
      needs.select-stage.outputs.stage == 'functional-bundle'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Download the exact native plan and receipts from this source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase-d-qualified-native-${{ github.sha }}
          path: ${{ runner.temp }}/phase-d-qualified-evidence
      - name: Plan and execute the complete fixed-checkpoint affected L0-L5 routine suite
        id: affected
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-full"
          plan="$RUNNER_TEMP/phase-d-qualified-evidence/phase-d-qualified-plan.json"
          report="$RUNNER_TEMP/phase-d-full/unit.json"
          log="$RUNNER_TEMP/phase-d-full/unit.log"
          cp "$plan" "$RUNNER_TEMP/phase-d-full/plan.json"
          plan="$RUNNER_TEMP/phase-d-full/plan.json"
          python3 - "$plan" "$RUNNER_TEMP/phase-d-full/functional-suites.txt" <<'PY'
          import json,sys
          plan=json.load(open(sys.argv[1],encoding="utf-8"))
          manifest=json.load(open("tests/gates/manifest.json",encoding="utf-8"))
          selected=set(plan["selected_files"])
          profiles={row.get("execution_profile") for row in manifest["test_files"] if row["path"] in selected}
          suites=[]
          if "hosted-isolated-compose" in profiles:
              suites.extend(["functional-ordinary","provider-cohort"])
          if "hosted-kernel-packet" in profiles:
              suites.append("packet-diagnostic")
          if not suites:
              raise SystemExit("fixed Phase D plan selected no hosted functional partitions")
          open(sys.argv[2],"w",encoding="utf-8").write("".join(s+"\n" for s in suites))
          PY
          set +e
          python tests/gates/gate.py run --plan "$plan" --include-native --defer-hosted \
            --output "$report" > "$log" 2>&1
          result=$?
          set -e
          tail -c 65536 "$log" || true
          printf 'unit_exit=%s\n' "$result" > "$RUNNER_TEMP/phase-d-full/unit-exit.txt"
          python3 - "$plan" "$GITHUB_ENV" <<'PY'
          import json,sys
          plan=json.load(open(sys.argv[1],encoding="utf-8"))
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write("FWROUTER_ACCEPTANCE_PLAN_DIGEST="+plan["plan_digest"]+"\n")
          PY
          exit "$result"
      - name: Provision exact runtime inputs
        id: provision
        run: |
          set -euo pipefail
          python tests/acceptance/provision.py --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" \
            > "$RUNNER_TEMP/phase-d-full/provision.log" 2>&1
          cp "$RUNNER_TEMP/fwrouter-acceptance-inputs/inputs.json" "$RUNNER_TEMP/phase-d-full/runtime-inputs.json"
      - name: Run exact hosted functional profile bundle and repeat only a green bundle
        id: functional
        run: |
          set -euo pipefail
          run_bundle() {
            attempt="$1"
            failed=0
            while IFS= read -r suite; do
              [ -n "$suite" ] || continue
              log="$RUNNER_TEMP/phase-d-full/${suite}-${attempt}.log"
              set +e
              /usr/bin/time -v python tests/acceptance/launcher.py --run --suite "$suite" > "$log" 2>&1
              result=$?
              set -e
              cat "$log"
              printf '%s_exit=%s\n' "$suite" "$result" >> "$RUNNER_TEMP/phase-d-full/functional-exits.txt"
              if [ "$result" -ne 0 ]; then failed=1; fi
            done < "$RUNNER_TEMP/phase-d-full/functional-suites.txt"
            return "$failed"
          }
          : > "$RUNNER_TEMP/phase-d-full/functional-exits.txt"
          first=0
          run_bundle 1 || first=$?
          if [ "$first" -ne 0 ]; then
            echo 'second_bundle=NOT_RUN_first_bundle_failed' >> "$RUNNER_TEMP/phase-d-full/functional-exits.txt"
            exit "$first"
          fi
          second=0
          run_bundle 2 || second=$?
          test "$second" -eq 0
      - name: Aggregate exact full-phase source, L0-L5, native, application, and browser evidence
        if: always()
        env:
          AFFECTED_OUTCOME: ${{ steps.affected.outcome }}
        run: |
          set -euo pipefail
          if [[ "$AFFECTED_OUTCOME" != success ]]; then
            unit_exit=1
            if [ -s "$RUNNER_TEMP/phase-d-full/unit-exit.txt" ]; then
              unit_exit="$(sed -n 's/^unit_exit=//p' "$RUNNER_TEMP/phase-d-full/unit-exit.txt" | tail -n 1)"
            fi
            case "$unit_exit" in
              ''|*[!0-9]*|0) unit_exit=1 ;;
            esac
            if [ "$unit_exit" -gt 255 ]; then unit_exit=1; fi
            python tests/gates/aggregate_hosted.py \
              --plan "$RUNNER_TEMP/phase-d-full/plan.json" \
              --unit-report "$RUNNER_TEMP/phase-d-full/unit.json" \
              --unit-failure-report --unit-exit-code "$unit_exit" \
              --output "$RUNNER_TEMP/phase-d-full/aggregate.json"
          fi
          args=(--plan "$RUNNER_TEMP/phase-d-full/plan.json" \
            --unit-report "$RUNNER_TEMP/phase-d-full/unit.json" \
            --runtime-inputs "$RUNNER_TEMP/phase-d-full/runtime-inputs.json" \
            --minimum-repeats 2 --output "$RUNNER_TEMP/phase-d-full/aggregate.json")
          while IFS= read -r path; do args+=(--qcp-report "$path"); done \
            < <(find "$RUNNER_TEMP/phase-d-qualified-evidence" -type f -name qualified-child-receipt.json -print | sort)
          while IFS= read -r path; do args+=(--xray-docker-report "$path"); done \
            < <(find "$RUNNER_TEMP/phase-d-qualified-evidence" -type f -name qualified-xray-docker-receipt.json -print | sort)
          while IFS= read -r path; do args+=(--hosted-report "$path"); done \
            < <(find "$RUNNER_TEMP" -type f -name hosted-acceptance-report.json -print | sort)
          python tests/gates/aggregate_hosted.py "${args[@]}"
      - name: Record final runner resource envelope
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/phase-d-full"
          {
            date -u +%FT%TZ
            free -h
            df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            docker ps --all --size
            docker network ls
            docker system df
          } > "$RUNNER_TEMP/phase-d-full/resources-after.txt" 2>&1
      - name: Retain full affected and functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-full-affected-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase-d-full/**
            ${{ runner.temp }}/fwrouter-acceptance-*-artifacts/**
            ${{ runner.temp }}/phase-d-qualified-evidence/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3
