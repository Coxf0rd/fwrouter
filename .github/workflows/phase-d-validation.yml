  minimal-xray-diagnostic:
    name: One isolated application/native diagnostic
    needs: [select-stage, bootstrap-and-fast]
    if: >-
      needs.bootstrap-and-fast.result == 'success' &&
      (needs.select-stage.outputs.stage == 'minimal' ||
       needs.select-stage.outputs.stage == 'qualified' ||
       needs.select-stage.outputs.stage == 'functional-bundle' ||
       needs.select-stage.outputs.stage == 'provider' ||
       needs.select-stage.outputs.stage == 'browser' ||
       needs.select-stage.outputs.stage == 'provider-cohort' ||
       needs.select-stage.outputs.stage == 'fence-diagnostic' ||
       needs.select-stage.outputs.stage == 'recovery-diagnostic' ||
       needs.select-stage.outputs.stage == 'reentry-diagnostic' ||
       needs.select-stage.outputs.stage == 'kernel-preflight' ||
       needs.select-stage.outputs.stage == 'kernel-recovery-diagnostic' ||
       needs.select-stage.outputs.stage == 'packet-diagnostic' ||
       needs.select-stage.outputs.stage == 'identity-diagnostic' ||
       needs.select-stage.outputs.stage == 'targets')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Bind diagnostic to fixed source and complete Phase D plan
        env:
          PHASE_D_BASE_SHA: ${{ needs.select-stage.outputs.stage == 'identity-diagnostic' && '1b302e91b3cd652cd4aab4f45bbdd88c088e5786' || '6bdf37e9c73b5728b8d50e971f34d848610eb345' }}
        run: |
          set -euo pipefail
          git cat-file -e "$PHASE_D_BASE_SHA^{commit}"
          plan="$RUNNER_TEMP/phase-d-diagnostic-plan.json"
          python tests/gates/gate.py plan --base "$PHASE_D_BASE_SHA" --include-native --output "$plan"
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["plan_digest"])' "$plan")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'FWROUTER_ACCEPTANCE_PLAN_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          cp "$plan" "$RUNNER_TEMP/phase-d-diagnostic-plan-copy.json"
      - name: Provision exact hosted Xray/Mihomo/browser inputs
        run: |
          set -euo pipefail
          /usr/bin/time -v python tests/acceptance/provision.py \
            --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" \
            > "$RUNNER_TEMP/phase-diagnostic-provision.log" 2>&1
          cp "$RUNNER_TEMP/fwrouter-acceptance-inputs/inputs.json" \
            "$RUNNER_TEMP/phase-diagnostic-runtime-inputs.json"
      - name: Run the fixed application/native diagnostic or kernel preflight
        if: needs.select-stage.outputs.stage != 'identity-diagnostic'
        env:
          VALIDATION_STAGE: ${{ needs.select-stage.outputs.stage }}
        run: |
          set -euo pipefail
          suite=xray-diagnostic
          if [[ "$VALIDATION_STAGE" == provider ]]; then suite=provider-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == browser ]]; then suite=browser-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == provider-cohort ]]; then suite=provider-cohort; fi
          if [[ "$VALIDATION_STAGE" == fence-diagnostic ]]; then suite=fence-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == recovery-diagnostic ]]; then suite=recovery-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == reentry-diagnostic ]]; then suite=reentry-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == targets ]]; then suite=target-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == kernel-preflight ]]; then suite=kernel-preflight; fi
          if [[ "$VALIDATION_STAGE" == kernel-recovery-diagnostic ]]; then suite=kernel-recovery-diagnostic; fi
          if [[ "$VALIDATION_STAGE" == packet-diagnostic ]]; then suite=packet-diagnostic; fi
          log="$RUNNER_TEMP/phase-diagnostic-xray.log"
          set +e
          /usr/bin/time -v python tests/acceptance/launcher.py --run --suite "$suite" \
            > "$log" 2>&1
          launcher_status=$?
          set -e
          python3 - "$log" <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "tests/acceptance")
          from launcher import _redact_public

          output = _redact_public(Path(sys.argv[1]).read_bytes(), limit=64 * 1024)
          sys.stdout.write(output)
          PY
          printf 'Acceptance launcher exit status: %s\n' "$launcher_status"
          exit "$launcher_status"
      - name: Run reviewed identity migration and two cold startup scale receipts
        if: needs.select-stage.outputs.stage == 'identity-diagnostic'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/phase-d-identities"
          mkdir -p "$root"
          run_launcher() {
            local suite="$1" log="$2" attempt_dir="${3:-}"
            local result=0
            /usr/bin/time -v python tests/acceptance/launcher.py --run --suite "$suite" \
              > "$log" 2>&1 || result=$?
            python3 - "$log" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tests/acceptance")
          from launcher import _redact_public
          print(_redact_public(Path(sys.argv[1]).read_bytes(), limit=65536).decode("utf-8", "replace"))
          PY
            if [ "$result" -eq 0 ] && [ -n "$attempt_dir" ]; then
              python3 - "$suite" "$attempt_dir" "$RUNNER_TEMP" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          suite, output, runner_temp = sys.argv[1], Path(sys.argv[2]), Path(sys.argv[3])
          prior = set()
          for receipt in output.parent.glob("startup-attempt-*/hosted-acceptance-report.json"):
              try:
                  prior.add(json.loads(receipt.read_text(encoding="utf-8")).get("suite_nonce"))
              except (OSError, json.JSONDecodeError):
                  pass
          candidates = []
          for receipt in runner_temp.glob("fwrouter-acceptance-*-artifacts/hosted-acceptance-report.json"):
              try:
                  row = json.loads(receipt.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if row.get("suite") == suite and row.get("suite_nonce") not in prior:
                  candidates.append((receipt.stat().st_mtime_ns, receipt, row))
          if not candidates:
              raise SystemExit("new startup suite receipt was not found")
          _mtime, receipt, row = max(candidates, key=lambda item: item[0])
          output.mkdir(parents=True, exist_ok=False)
          for name in ("hosted-acceptance-report.json", "runtime-scale-metrics.json",
                       "application-acceptance.xml", "application-acceptance-receipt.json"):
              source = receipt.parent / name
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"startup receipt artifact is missing or unsafe: {name}")
              shutil.copyfile(source, output / name)
          (output / "attempt.json").write_text(json.dumps({
              "suite": row.get("suite"), "suite_nonce": row.get("suite_nonce"),
              "source_revision": row.get("source_revision"), "plan_digest": row.get("plan_digest"),
              "artifact_source": str(receipt.parent.name),
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
            fi
            return "$result"
          }
          run_launcher identity-diagnostic "$root/identity-migration.log"
          run_launcher runtime-scale-diagnostic "$root/startup-attempt-1.log" "$root/startup-attempt-1"
          run_launcher runtime-scale-diagnostic "$root/startup-attempt-2.log" "$root/startup-attempt-2"
          python3 - "$root" <<'PY'
          import json, sys
          from pathlib import Path
          import os
          root = Path(sys.argv[1])
          scale = []
          errors = []
          for attempt_dir in sorted(root.glob("startup-attempt-[12]")):
              path = attempt_dir / "hosted-acceptance-report.json"
              try:
                  row = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  errors.append(f"invalid receipt: {path.name}")
                  continue
              if row.get("suite") != "runtime-scale-diagnostic":
                  continue
              if row.get("status") != "passed":
                  errors.append(f"runtime scale hosted receipt is not passed: {path.name}")
              if row.get("source_revision") != __import__("subprocess").check_output(
                      ["git", "rev-parse", "HEAD"], text=True).strip():
                  errors.append(f"runtime scale source revision mismatch: {path.name}")
              if row.get("plan_digest") != os.environ.get("FWROUTER_ACCEPTANCE_PLAN_DIGEST"):
                  errors.append(f"runtime scale plan digest mismatch: {path.name}")
              if not row.get("suite_nonce"):
                  errors.append(f"runtime scale suite nonce missing: {path.name}")
              metrics_path = attempt_dir / "runtime-scale-metrics.json"
              try:
                  metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  errors.append(f"startup metrics missing or invalid: {metrics_path.name}")
                  continue
              value = metrics.get("startup_wall_seconds")
              if not isinstance(value, (int, float)) or isinstance(value, bool):
                  errors.append(f"startup wall time missing: {metrics_path.name}")
              elif value >= 45:
                  errors.append(f"startup exceeded hard 45 second budget: {metrics_path.name}")
              scale.append({"attempt": len(scale) + 1, "suite_nonce": row.get("suite_nonce"),
                            "source_revision": row.get("source_revision"),
                            "plan_digest": row.get("plan_digest"),
                            "startup_wall_seconds": value,
                            "engineering_margin_40s": value < 40 if isinstance(value, (int, float)) else False})
          if len(scale) != 2:
              errors.append(f"expected two independent cold startup receipts; found {len(scale)}")
          if len({item.get("suite_nonce") for item in scale}) != len(scale):
              errors.append("cold startup receipts do not have distinct run nonces")
          margin_demonstrated = len(scale) == 2 and all(
              isinstance(item["startup_wall_seconds"], (int, float))
              and item["startup_wall_seconds"] < 40 for item in scale)
          result = {"schema": "fwrouter-startup-scale-repeat/v1",
                    "status": "failed" if errors else "passed",
                    "hard_budget_seconds": 45,
                    "engineering_margin_goal_seconds": 40,
                    "engineering_margin_status": "demonstrated" if margin_demonstrated else "not_demonstrated",
                    "startup_margin_claim": "at_least_5_seconds" if margin_demonstrated else "none",
                    "source_commit": __import__("subprocess").check_output(
                        ["git", "rev-parse", "HEAD"], text=True).strip(),
                    "attempts": scale, "errors": errors}
          (root / "startup-repeat-validation.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(bool(errors))
          PY
      - name: Validate the strict application/native smoke receipt
        if: success() && needs.select-stage.outputs.stage == 'minimal'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tests/gates")
          import aggregate_hosted
          import gate

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          plan_path = root / "phase-d-diagnostic-plan-copy.json"
          inputs_path = root / "phase-diagnostic-runtime-inputs.json"
          report_path = root / "phase-d-main-smoke-validation.json"
          problems = []
          source_commit = ""
          plan_digest = ""
          receipt_count = 0
          try:
              plan = aggregate_hosted.read_json(plan_path)
              source_commit = str(plan.get("source_commit", ""))
              plan_digest = str(plan.get("plan_digest", ""))
              if source_commit != os.environ.get("EXPECTED_SOURCE_SHA"):
                  problems.append("diagnostic plan source does not match this workflow SHA")
              gate.ensure_plan(plan, gate.load_manifest())
              runtime_inputs = aggregate_hosted.read_json(inputs_path)
              aggregate_hosted.validate_runtime_inputs(runtime_inputs)
              receipts = []
              for candidate in root.rglob("hosted-acceptance-report.json"):
                  try:
                      value = aggregate_hosted.read_json(candidate)
                  except (gate.GateError, OSError, ValueError, json.JSONDecodeError) as exc:
                      problems.append(f"invalid hosted receipt {candidate.name}: {type(exc).__name__}")
                      continue
                  if value.get("suite") == "xray-diagnostic":
                      receipts.append(candidate)
              receipt_count = len(receipts)
              if receipt_count != 1:
                  problems.append(f"expected exactly one xray-diagnostic hosted receipt; found {receipt_count}")
              else:
                  problems.extend(aggregate_hosted.validate_main_smoke_receipt(
                      receipts[0], plan, runtime_inputs,
                      hosted_paths=[], required_partitions=[]))
          except Exception as exc:
              problems.append(f"validation failed: {type(exc).__name__}: {exc}")

          errors = [gate.redact_failure_output(item)[:512] for item in problems[:8]]
          result = {
              "schema": "fwrouter-phase-d-main-smoke-validation/v1",
              "status": "failed" if errors else "passed",
              "source_commit": source_commit[:64],
              "plan_digest": plan_digest[:64],
              "receipt_count": receipt_count,
              "errors": errors,
          }
          temporary = report_path.with_suffix(".tmp")
          temporary.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          temporary.replace(report_path)
          print(json.dumps(result, sort_keys=True))
          if errors:
              raise SystemExit(1)
          PY
      - name: Retain bounded Xray diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-xray-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase-d-identities/**
            ${{ runner.temp }}/phase-d-diagnostic-plan-copy.json
            ${{ runner.temp }}/phase-diagnostic-*.log
            ${{ runner.temp }}/phase-diagnostic-runtime-inputs.json
            ${{ runner.temp }}/phase-d-main-smoke-validation.json
            ${{ runner.temp }}/fwrouter-acceptance-*-artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3
