    name: Fixed 18 host-independent read-model fixture nodes
    needs: [select-stage]
    if: needs.select-stage.outputs.stage == 'targets'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
