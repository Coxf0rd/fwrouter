name: Phase D branch validation (temporary)

on:
  push:
    branches: [stage/test-architecture-ci-stabilization]

permissions:
  contents: read

concurrency:
  group: fwrouter-phase-d-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-fast:
    name: Bootstrap isolation and affected L0-L1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Lint workflow syntax using pinned actionlint binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Validate manifest and static gate contracts
        run: |
          python tests/gates/gate.py validate
          python tests/gates/gate.py dry-run --level L7
      - name: Verify fresh-child isolation bootstrap
        run: python tests/gates/isolation_smoke.py
      - name: Resolve immutable push base and run affected L0-L1
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$EVENT_BEFORE" ] || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            echo "The push event has no resolvable immutable before SHA" >&2
            exit 2
          fi
          PLAN="$RUNNER_TEMP/fwrouter-fast-plan.json"
          REPORT="$RUNNER_TEMP/fwrouter-fast-report.json"
          python tests/gates/gate.py plan --base "$EVENT_BEFORE" --quick-push --output "$PLAN"
          python tests/gates/gate.py run --plan "$PLAN" --output "$REPORT"
      - name: Retain bounded gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-fast-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-fast-plan.json
            ${{ runner.temp }}/fwrouter-fast-report.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  historical-seven:
    name: Historical failures, exact node IDs (red remains visible)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Run seven unresolved Phase B nodes without suppression
        run: |
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-b-seven.xml" \
            --report "$RUNNER_TEMP/phase-b-seven.json" \
            --log "$RUNNER_TEMP/phase-b-seven.log" \
            tests/test_reconcile_core.py::test_reconcile_endpoint_returns_contract_and_is_read_only \
            tests/test_state_routes.py::test_state_endpoints_are_get_only_and_read_only \
            tests/test_state_routes.py::test_read_endpoints_do_not_bootstrap_builtin_subjects_or_routing_state \
            tests/test_xray.py::test_vpn_auto_invalid_stage_keeps_database_and_active_xray_unchanged \
            tests/test_xray.py::test_legacy_subscription_get_is_read_only \
            tests/test_performance_optimizations.py::test_runtime_topology_batch_matches_single_and_uses_one_observation \
            tests/test_xray_vpn_auto_lifecycle.py::test_vpn_auto_reconcile_removes_stale_identity_and_recreates_one_stable_identity
      - name: Retain exact-node baseline report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-historical-seven-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase-b-seven.xml
            ${{ runner.temp }}/phase-b-seven.json
            ${{ runner.temp }}/phase-b-seven.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  affected-unit:
    name: Affected L0-L5 routine suites (hosted profiles deferred explicitly)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Plan and run all affected routine suites without silently skipping profiles
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$EVENT_BEFORE" ] || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            echo "Push has no resolvable immutable before SHA" >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/phase-d-unit"
          plan="$RUNNER_TEMP/phase-d-unit/plan.json"
          report="$RUNNER_TEMP/phase-d-unit/unit.json"
          log="$RUNNER_TEMP/phase-d-unit/unit.log"
          python tests/gates/gate.py plan --base "$EVENT_BEFORE" --include-native --output "$plan"
          set +e
          python tests/gates/gate.py run --plan "$plan" --include-native --defer-hosted \
            --output "$report" > "$log" 2>&1
          result=$?
          set -e
          tail -c 65536 "$log" || true
          test "$result" -eq 0
      - name: Retain affected unit evidence, including redacted suite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-unit-${{ github.sha }}
          path: ${{ runner.temp }}/phase-d-unit/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  hosted-functional:
    name: Hosted native/application/browser acceptance (two clean runs)
    needs: [affected-unit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
      - name: Record hosted runner resource envelope
        run: |
          mkdir -p "$RUNNER_TEMP/phase-d-resources"
          {
            date -u +%FT%TZ
            uname -a
            nproc
            free -h
            df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            docker version
            docker compose version
          } > "$RUNNER_TEMP/phase-d-resources/runner-before.txt" 2>&1
      - name: Bind hosted acceptance to the immutable affected plan
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$EVENT_BEFORE" ] || ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            echo "The push event has no resolvable immutable before SHA" >&2
            exit 2
          fi
          PLAN="$RUNNER_TEMP/phase-d-plan.json"
          python tests/gates/gate.py plan --base "$EVENT_BEFORE" --include-native --output "$PLAN"
          PLAN_DIGEST=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["plan_digest"])' "$PLAN")
          printf 'FWROUTER_ACCEPTANCE_PLAN_DIGEST=%s\n' "$PLAN_DIGEST" >> "$GITHUB_ENV"
          cp "$PLAN" "$RUNNER_TEMP/phase-d-resources/affected-plan.json"
      - name: Download and verify pinned Xray, Mihomo, and Chromium inputs
        run: |
          set -o pipefail
          /usr/bin/time -v python tests/acceptance/provision.py \
            --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/phase-d-resources/provision.log"
          cp "$RUNNER_TEMP/fwrouter-acceptance-inputs/inputs.json" \
            "$RUNNER_TEMP/phase-d-resources/runtime-inputs.json"
      - name: Run all functional hosted scenarios twice from clean isolation
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -v python tests/acceptance/launcher.py --run --suite functional \
            2>&1 | tee "$RUNNER_TEMP/phase-d-resources/functional-run-1.log"
          first=${PIPESTATUS[0]}
          /usr/bin/time -v python tests/acceptance/launcher.py --run --suite functional \
            2>&1 | tee "$RUNNER_TEMP/phase-d-resources/functional-run-2.log"
          second=${PIPESTATUS[0]}
          set -e
          printf 'run1_exit=%s\nrun2_exit=%s\n' "$first" "$second" \
            | tee "$RUNNER_TEMP/phase-d-resources/functional-exits.txt"
          test "$first" -eq 0 -a "$second" -eq 0
      - name: Run exact qualified-child and Docker-Xray native lanes
        if: always()
        run: |
          set -euo pipefail
          failures=0
          for spec in 'qualified_child.py qcp' 'qualified_xray_docker.py xray-docker'; do
            set -- $spec
            helper=$1
            label=$2
            set +e
            /usr/bin/time -v python "tests/acceptance/$helper" --run \
              > "$RUNNER_TEMP/phase-d-resources/$label.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/phase-d-resources/$label.log"
            if [ "$result" -ne 0 ]; then failures=1; fi
          done
          test "$failures" -eq 0
      - name: Download independent affected unit report
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase-d-unit-${{ github.sha }}
          path: ${{ runner.temp }}/phase-d-unit-evidence
      - name: Aggregate exact source, routine, native, application, and browser coverage
        if: always()
        run: |
          set -euo pipefail
          args=(--plan "$RUNNER_TEMP/phase-d-resources/affected-plan.json" \
            --unit-report "$RUNNER_TEMP/phase-d-unit-evidence/unit.json" \
            --runtime-inputs "$RUNNER_TEMP/phase-d-resources/runtime-inputs.json" \
            --minimum-repeats 2 --output "$RUNNER_TEMP/phase-d-resources/aggregate.json")
          profiles=$(python -c 'import json,sys; print(" ".join(json.load(open(sys.argv[1]))["required_execution_profiles"]))' \
            "$RUNNER_TEMP/phase-d-resources/affected-plan.json")
          selected=$(python -c 'import json,sys; print(" ".join(json.load(open(sys.argv[1]))["selected_files"]))' \
            "$RUNNER_TEMP/phase-d-resources/affected-plan.json")
          needs_qcp=$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); s=set(p["selected_files"]); m=json.load(open("tests/gates/manifest.json")); print("true" if any(r.get("execution_profile")=="qualified-child-process" and r["path"] in s and r["path"]!="backend/tests/test_xray_native_readback.py" for r in m["test_files"]) else "false")' \
            "$RUNNER_TEMP/phase-d-resources/affected-plan.json")
          if [[ " $profiles " == *" hosted-isolated-compose "* ]]; then
            while IFS= read -r path; do args+=(--hosted-report "$path"); done \
              < <(find "$RUNNER_TEMP" -type f -name hosted-acceptance-report.json -print | sort)
          fi
          if [ "$needs_qcp" = true ]; then
            while IFS= read -r path; do args+=(--qcp-report "$path"); done \
              < <(find "$RUNNER_TEMP" -type f -name qualified-child-receipt.json -print | sort)
          fi
          if [[ " $selected " == *" backend/tests/test_xray_native_readback.py "* ]]; then
            while IFS= read -r path; do args+=(--xray-docker-report "$path"); done \
              < <(find "$RUNNER_TEMP" -type f -name qualified-xray-docker-receipt.json -print | sort)
          fi
          python tests/gates/aggregate_hosted.py "${args[@]}"
      - name: Record hosted runner resource envelope after acceptance
        if: always()
        run: |
          {
            date -u +%FT%TZ
            free -h
            df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            docker ps --all --size
            docker network ls
          } > "$RUNNER_TEMP/phase-d-resources/runner-after.txt" 2>&1
      - name: Retain hosted acceptance and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-hosted-functional-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fwrouter-acceptance-*-artifacts/**
            ${{ runner.temp }}/phase-d-resources/**
            ${{ runner.temp }}/phase-d-unit-evidence/**
            ${{ runner.temp }}/fwrouter-xray-native-*-artifacts/**
            ${{ runner.temp }}/fwrouter-qcp-*-artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3
