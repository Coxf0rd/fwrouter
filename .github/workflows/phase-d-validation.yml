name: Phase D branch validation (temporary)

on:
  push:
    branches: [stage/test-architecture-ci-stabilization, fix/api-runtime-health-scale-stability]

permissions:
  contents: read

concurrency:
  group: fwrouter-phase-d-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-stage:
    name: Require an explicit Phase D validation marker
    if: >-
      contains(github.event.head_commit.message, 'ci:validate-') &&
      !contains(github.event.head_commit.message, 'ci:validate-dependencies')
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - id: stage
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          markers = {
              "ci:validate-minimal": "minimal",
              "ci:validate-provider": "provider",
              "ci:validate-browser": "browser",
              "ci:validate-cohort": "provider-cohort",
              "ci:validate-fences": "fence-diagnostic",
              "ci:validate-recovery": "recovery-diagnostic",
              "ci:validate-reentry": "reentry-diagnostic",
              "ci:validate-targets": "targets",
              "ci:validate-host-fixtures": "host-fixtures",
              "ci:validate-zero": "zero",
              "ci:validate-qualified": "qualified",
              "ci:validate-functional-bundle": "functional-bundle",
              "ci:validate-metadata": "metadata",
              "ci:validate-kernel": "kernel-preflight",
              "ci:validate-dataplane": "kernel-recovery-diagnostic",
              "ci:validate-packet": "packet-diagnostic",
              "ci:validate-udp-unit": "udp-unit",
              "ci:validate-unit-fixtures": "unit-fixtures",
              "ci:validate-unit-residual": "unit-residual",
              "ci:validate-unit-acceptance-tail": "unit-acceptance-tail",
              "ci:validate-identities": "identity-diagnostic",
          }
          message = os.environ.get("HEAD_COMMIT_MESSAGE", "")
          selected = [stage for marker, stage in markers.items() if marker in message]
          if len(selected) > 1:
              print("Commit message may contain only one ci:validate-* marker", file=sys.stderr)
              raise SystemExit(2)
          stage = selected[0] if selected else "preflight"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stage={stage}\n")
          print(f"Selected controlled validation stage: {stage}")
          PY

  unit-fixtures:
    name: Fixed isolated unit fixture cohort
    needs: [select-stage]
    if: needs.select-stage.outputs.stage == 'unit-fixtures' || needs.select-stage.outputs.stage == 'unit-residual' || needs.select-stage.outputs.stage == 'unit-acceptance-tail'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed test dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Run exact fixed unit fixture cohort
        env:
          UNIT_FIXTURE_COHORT: ${{ needs.select-stage.outputs.stage == 'unit-residual' && 'residual' || (needs.select-stage.outputs.stage == 'unit-acceptance-tail' && 'acceptance-tail' || 'default') }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/phase-d-unit-fixtures"
          mkdir -p "$artifact_root"
          max_attempts=1
          if [ "$UNIT_FIXTURE_COHORT" = acceptance-tail ]; then max_attempts=5; fi
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            attempt_dir="$artifact_root/attempt-$attempt"
            mkdir -p "$attempt_dir"
            result=0
            python tests/gates/gate.py validate-unit-fixtures \
              --cohort "$UNIT_FIXTURE_COHORT" \
              --output "$attempt_dir/unit-fixtures-report.json" \
              --artifact-dir "$attempt_dir" || result=$?
            printf 'cohort=%s\nattempt=%s\nexit_code=%s\n' \
              "$UNIT_FIXTURE_COHORT" "$attempt" "$result" > "$attempt_dir/attempt-result.txt"
            if [ "$result" -ne 0 ]; then
              printf 'acceptance-tail attempt %s failed; stopping repetitions\n' "$attempt"
              exit "$result"
            fi
            attempt=$((attempt + 1))
          done
      - name: Retain per-file JUnit, redacted logs, and cohort report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-unit-fixtures-${{ needs.select-stage.outputs.stage }}-${{ github.sha }}
          path: ${{ runner.temp }}/phase-d-unit-fixtures/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3

  bootstrap-and-fast:
    name: Static checks, bootstrap, focused infra L1
    needs: [select-stage]
    if: needs.select-stage.outputs.stage != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.2
          cache: pip
          cache-dependency-path: tests/gates/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Install hashed CI dependencies
        run: python -m pip install --require-hashes -r tests/gates/requirements-ci.txt
      - name: Lint all workflow files with pinned actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Check full Phase D delta syntax and whitespace from fixed checkpoint
        env:
          PHASE_D_BASE_SHA: ${{ needs.select-stage.outputs.stage == 'identity-diagnostic' && '1b302e91b3cd652cd4aab4f45bbdd88c088e5786' || '6bdf37e9c73b5728b8d50e971f34d848610eb345' }}
        run: |
          set -euo pipefail
          git cat-file -e "$PHASE_D_BASE_SHA^{commit}"
          git diff --check "$PHASE_D_BASE_SHA...HEAD"
          python3 - "$PHASE_D_BASE_SHA" <<'PY'
          import ast
          import json
          import subprocess
          import sys
          from pathlib import Path

          base = sys.argv[1]
          files = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", f"{base}...HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          for name in files:
              path = Path(name)
              if not path.is_file():
                  continue
              if path.suffix == ".py":
                  ast.parse(path.read_text(encoding="utf-8"), filename=name)
              elif path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
          print(f"Parsed Python/JSON syntax for {len(files)} changed paths")
          PY
          python tests/gates/gate.py lint-changed --base "$PHASE_D_BASE_SHA"
      - name: Validate manifest and isolation boundary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/gate.py validate \
            > "$RUNNER_TEMP/phase-d-preflight/manifest-validation.log" 2>&1
          python tests/gates/isolation_smoke.py \
            > "$RUNNER_TEMP/phase-d-preflight/isolation-smoke.json" 2>&1
      - name: Run focused test-infrastructure L1 contract suites
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/test_gate_contract.py \
            > "$RUNNER_TEMP/phase-d-preflight/gate-contract.log" 2>&1
          python tests/gates/test_acceptance_contract.py \
            > "$RUNNER_TEMP/phase-d-preflight/acceptance-contract.log" 2>&1
          python tests/gates/test_network_fixture_contract.py \
            > "$RUNNER_TEMP/phase-d-preflight/network-fixture-contract.log" 2>&1
          python tests/gates/test_smoke_contract.py \
            > "$RUNNER_TEMP/phase-d-preflight/smoke-contract.log" 2>&1
      - name: Run subscription identity L1 subset through the manifest gate
        if: needs.select-stage.outputs.stage == 'identity-diagnostic'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/phase-d-identities"
          mkdir -p "$root"
          python tests/gates/gate.py subset-plan --domain test-infrastructure --level L1 \
            --output "$root/subscription-l1-plan.json" > "$root/subscription-l1-plan.log"
          set +e
          python tests/gates/gate.py run --plan "$root/subscription-l1-plan.json" \
            --manual-subset --output "$root/subscription-l1-report.json" \
            > "$root/subscription-l1-run.raw" 2>&1
          result=$?
          set -e
          python3 - "$root/subscription-l1-run.raw" "$root/subscription-l1-run.log" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests/gates")
          from gate import redact_failure_output
          output = redact_failure_output(Path(sys.argv[1]).read_text(encoding="utf-8"))[-65536:]
          Path(sys.argv[2]).write_text(output, encoding="utf-8")
          print(output)
          PY
          rm -f "$root/subscription-l1-run.raw"
          exit "$result"
      - name: Run identity migration L3 regression nodes in the isolated gate
        if: needs.select-stage.outputs.stage == 'identity-diagnostic'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/phase-d-identities"
          mkdir -p "$root"
          result=0
          python tests/gates/run_exact_nodes.py \
            --junit "$root/migration-l3.xml" \
            --report "$root/migration-l3-report.json" \
            --log "$root/migration-l3.log" \
            tests/test_db_migrations.py::test_database_upgrade_cli_is_explicit_backed_up_and_idempotent \
            tests/test_db_migrations.py::test_database_upgrade_cli_refuses_schema_24_structural_drift_without_backup \
            tests/test_db_migrations.py::test_v24_to25_adds_identity_tables_without_changing_legacy_rows_or_admitting_downgrade \
            tests/test_db_migrations.py::test_subscription_identity_migration_preserves_references_and_membership \
            tests/test_xray_vpn_auto_lifecycle.py::test_reviewed_profile_identity_mapping_preserves_credentials_without_publishing \
            tests/test_xray_vpn_auto_lifecycle.py::test_unmapped_inventory_replacement_does_not_inherit_or_publish_identity \
            tests/test_subscription_refresh_outcomes.py::test_staged_profile_verification_runs_outside_writer_guard \
            tests/test_subscription_refresh_outcomes.py::test_staged_profile_failed_terminal_verification_keeps_own_core_revision_for_rollback || result=$?
          if [ "$result" -eq 0 ]; then
            python tests/gates/gate.py subset-plan --domain xray --level L3 \
              --output "$root/xray-l3-plan.json" > "$root/xray-l3-plan.log"
            set +e
            python tests/gates/gate.py run --plan "$root/xray-l3-plan.json" \
              --manual-subset --output "$root/xray-l3-report.json" \
              > "$root/xray-l3-run.raw" 2>&1
            result=$?
            set -e
            python3 - "$root/xray-l3-run.raw" "$root/xray-l3-run.log" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests/gates")
          from gate import redact_failure_output
          output = redact_failure_output(Path(sys.argv[1]).read_text(encoding="utf-8"))[-65536:]
          Path(sys.argv[2]).write_text(output, encoding="utf-8")
          print(output)
          PY
            rm -f "$root/xray-l3-run.raw"
          fi
          exit "$result"
      - name: Retain sanitized identity qualification evidence
        if: always() && needs.select-stage.outputs.stage == 'identity-diagnostic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-d-identity-l1-l3-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase-d-identities/subscription-l1-plan.json
            ${{ runner.temp }}/phase-d-identities/subscription-l1-plan.log
            ${{ runner.temp }}/phase-d-identities/subscription-l1-report.json
            ${{ runner.temp }}/phase-d-identities/subscription-l1-run.log
            ${{ runner.temp }}/phase-d-identities/migration-l3.xml
            ${{ runner.temp }}/phase-d-identities/migration-l3-report.json
            ${{ runner.temp }}/phase-d-identities/migration-l3.log
            ${{ runner.temp }}/phase-d-identities/xray-l3-plan.json
            ${{ runner.temp }}/phase-d-identities/xray-l3-plan.log
            ${{ runner.temp }}/phase-d-identities/xray-l3-report.json
            ${{ runner.temp }}/phase-d-identities/xray-l3-run.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 3
      - name: Run qualified source-manifest regression before native profiles
        if: >-
          needs.select-stage.outputs.stage == 'qualified' ||
          needs.select-stage.outputs.stage == 'functional-bundle'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/qualified-source-manifest-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/qualified-source-manifest-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/qualified-source-manifest-nodeids.log" \
            tests/test_isolation_bootstrap.py::test_qualified_source_digest_uses_shared_complete_allowlisted_inventory
      - name: Run exact selective live-mode and preflight regressions
        if: >-
          needs.select-stage.outputs.stage == 'reentry-diagnostic' ||
          needs.select-stage.outputs.stage == 'packet-diagnostic'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/selective-live-mode-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/selective-live-mode-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/selective-live-mode-nodeids.log" \
            tests/test_dataplane_live.py::test_live_global_mode_classifies_normal_and_degraded_selective_defaults \
            tests/test_dataplane_live.py::test_live_global_mode_keeps_conflicting_selective_defaults_ambiguous \
            tests/test_dataplane_live.py::test_live_global_mode_does_not_infer_default_from_selective_marker_alone \
            tests/test_dataplane_global.py::test_global_vpn_preflight_allows_prepare_with_empty_reject_selector_without_egress \
            tests/test_dataplane_global.py::test_selective_vpn_policy_prepare_is_separate_from_egress_verification \
            tests/test_apply_pipeline.py::test_render_owned_table_candidate_fail_closes_selective_vpn_default_until_policy_ready \
            tests/test_apply_pipeline.py::test_apply_pipeline_selective_degraded_blocks_vpn_sets_and_fails_closed_for_vpn_default \
            tests/test_mihomo_config_runtime.py::test_reconcile_mihomo_selective_default_fast_requires_full_compile_when_udp_guard_sequence_changes \
            tests/test_mihomo_config_runtime.py::test_mihomo_fingerprint_ignores_derived_auto_selection_but_tracks_generation_inputs \
            tests/test_mihomo_config_runtime.py::test_mihomo_publication_fence_rejects_newer_selection_with_stable_derived_input_hash \
            tests/test_routing_drift_reapply.py::test_set_selective_default_reapplies_when_live_dataplane_drift_is_detected \
            tests/test_routing_drift_reapply.py::test_set_selective_default_does_not_retry_unmarked_fast_failure
      - name: Run exact manual-rules actor and apply-audit regressions
        if: needs.select-stage.outputs.stage == 'packet-diagnostic'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/manual-rules-actor-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/manual-rules-actor-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/manual-rules-actor-nodeids.log" \
            tests/test_rules.py::test_manual_rules_api_forwards_request_actor_to_draft_service \
            tests/test_apply_orchestrator.py::test_manual_rules_apply_audit_counts_prior_rules \
            tests/test_apply_orchestrator.py::test_mark_rules_job_success_forwards_audit_change_without_mutating_it
      - name: Run exact DNS effective-artifact freshness regressions
        if: needs.select-stage.outputs.stage == 'packet-diagnostic'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/dns-artifact-freshness-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/dns-artifact-freshness-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/dns-artifact-freshness-nodeids.log" \
            tests/test_dataplane_global.py::test_read_effective_rules_artifact_fresh_bypasses_stale_cache_and_inflight \
            tests/test_dataplane_global.py::test_read_effective_rules_artifact_falls_back_to_last_good \
            tests/test_dnsmasq.py::test_reconcile_dnsmasq_rules_fails_when_dns_capture_enforcement_fails \
            tests/test_dnsmasq.py::test_reconcile_dnsmasq_rules_reports_dns_capture_success \
            tests/test_dnsmasq.py::test_reconcile_dnsmasq_rules_force_restarts_without_config_change \
            tests/test_dnsmasq.py::test_reconcile_dnsmasq_rules_forces_android_connectivity_domains_direct \
            tests/test_dnsmasq.py::test_reconcile_dnsmasq_rules_restarts_when_nftset_probe_is_unhealthy \
            tests/test_dnsmasq.py::test_reconcile_dnsmasq_rules_waits_for_nftset_probe_after_restart
      - name: Run the fixed metadata-override exact-node set
        if: needs.select-stage.outputs.stage == 'metadata'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/metadata-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/metadata-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/metadata-nodeids.log" \
            tests/test_provider_configuration.py::test_automatic_member_switch_policy_is_local_persistent_and_revision_neutral \
            tests/test_provider_configuration.py::test_new_provider_binding_defaults_automatic_member_switch_to_disabled \
            tests/test_provider_configuration.py::test_schema_23_provider_policy_migration_preserves_identity_credentials_and_is_idempotent \
            tests/test_provider_recovery.py::test_disabled_automatic_member_switch_gates_phase_two_before_provider_io \
            tests/test_provider_recovery.py::test_policy_disabled_phase_two_advances_to_existing_emergency_direct_phase \
            tests/test_provider_managed_integration.py::test_disabled_automatic_member_switch_removes_provider_from_auto_candidates \
            tests/test_provider_managed_integration.py::test_automatic_switch_operation_with_policy_off_makes_zero_adapter_calls \
            tests/test_vpn_auto_exclusive.py::test_inventory_keeps_outside_auto_intent_editable_without_effective_pool_churn \
            tests/test_provider_configuration.py::test_unknown_source_discovery_returns_not_found_without_provider_io
      - name: Run the fixed host-runtime fixture exact-node set
        if: needs.select-stage.outputs.stage == 'host-fixtures'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/host-fixtures-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/host-fixtures-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/host-fixtures-nodeids.log" \
            tests/test_apply_pipeline.py::test_render_owned_table_candidate_uses_port_only_tproxy_target \
            tests/test_apply_pipeline.py::test_render_owned_table_candidate_keeps_direct_and_vpn_terminal_chains_separate \
            tests/test_runtime_summary.py::test_runtime_summary_contains_layout_and_modules \
            tests/test_runtime_summary.py::test_runtime_summary_checks_applied_dataplane_artifacts \
            tests/test_network_contract.py::test_network_contract_drives_protected_dataplane_and_rules \
            tests/test_network_contract.py::test_network_contract_drives_nft_trusted_client_guards
      - name: Run fixed Mihomo zero-delay contract nodes
        if: needs.select-stage.outputs.stage == 'zero'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/zero-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/zero-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/zero-nodeids.log" \
            tests/test_mihomo_adapter.py::test_mihomo_zero_history_is_healthy_only_when_native_alive_and_well_formed \
            tests/test_mihomo_adapter.py::test_mihomo_group_probe_accepts_zero_and_preserves_last_good_for_invalid_samples \
            tests/test_mihomo_adapter.py::test_mihomo_member_zero_503_requires_fresh_exact_url_state_readback \
            tests/test_mihomo_adapter.py::test_mihomo_member_zero_503_without_exact_fresh_proof_stays_failed \
            tests/test_mihomo_adapter.py::test_mihomo_delay_zero_fallback_does_not_probe_on_other_errors
      - name: Run exact UDP capability and Mihomo policy regression nodes
        if: needs.select-stage.outputs.stage == 'udp-unit'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-d-preflight"
          python tests/gates/run_exact_nodes.py \
            --junit "$RUNNER_TEMP/phase-d-preflight/udp-unit-nodeids.xml" \
            --report "$RUNNER_TEMP/phase-d-preflight/udp-unit-nodeids.json" \
            --log "$RUNNER_TEMP/phase-d-preflight/udp-unit-nodeids.log" \
            tests/test_protocol_adapters.py::test_vless_udp_capability_is_tri_state_and_native_attempt_is_idempotent \
            tests/test_protocol_adapters.py::test_vless_udp_capability_rejects_invalid_and_duplicate_uri_values \
            tests/test_mihomo_config_runtime.py::test_build_mihomo_config_scopes_subject_server_override_to_vpn_rules_only \
            tests/test_mihomo_config_runtime.py::test_build_mihomo_config_renders_effective_domain_and_cidr_rules \
            tests/test_mihomo_config_runtime.py::test_build_mihomo_config_uses_vpn_fallback_when_requested \
            tests/test_mihomo_config_runtime.py::test_transparent_fallback_validation_accounts_for_terminal_vpn_udp_guard \
            tests/test_mihomo_adapter.py::test_vpn_udp_native_readback_requires_reject_groups_and_paired_guards \
