services:
  fwrouter-xray:
    image: teddysun/xray:26.2.6@sha256:8c2017c7af290fe3c15268e82e658f3d51dab4369bac164b79cf2b2f175cdcea
    container_name: fwrouter-xray
    restart: unless-stopped
    networks:
      - fwrouter_proxy
    volumes:
      - /var/lib/fwrouter-v2/xray/config.json:/etc/xray/config.json:ro
      - /var/log/fwrouter/xray:/var/log/xray
    expose:
      - "5300"

networks:
  fwrouter_proxy:
    name: ${FWROUTER_DOCKER_PROXY_NETWORK:-fwrouter_proxy}
    external: true
